spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/autoprocess?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:autoprocess}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.autoprocess: debug

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-at-least-32-bytes}
    expire-seconds: 7200
